<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Signal Board</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0e1118; color: #ffffff; margin: 0; padding: 15px; text-align: center; }
        .welcome-box { background: linear-gradient(135deg, #171c26 0%, #1f2634 100%); padding: 22px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #283042; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        .welcome-box h1 { margin: 0; color: #00e676; font-size: 22px; text-transform: uppercase; letter-spacing: 1px; }
        .welcome-box p { color: #8895b3; font-size: 13px; margin: 6px 0 0; font-style: italic; }
        .admin-box { background: #171c26; padding: 15px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #2e3748; text-align: left; }
        .admin-box h3 { margin: 0 0 8px 0; color: #00b0ff; font-size: 14px; text-transform: uppercase; border-bottom: 1px solid #283042; padding-bottom: 5px; }
        .admin-detail { display: flex; justify-content: space-between; font-size: 13px; margin: 5px 0; color: #b0b9cd; }
        .admin-detail b { color: #ffffff; }
        .social-links { display: flex; justify-content: center; gap: 12px; margin-bottom: 25px; }
        .social-btn { flex: 1; padding: 12px 10px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; color: white; display: inline-block; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .fb-btn { background: #1877f2; }
        .insta-btn { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); }
        .tab-container { display: flex; justify-content: space-around; background: #171c26; border-radius: 12px; padding: 6px; margin-bottom: 20px; border: 1px solid #283042; }
        .tab-btn { flex: 1; padding: 12px; border: none; background: transparent; color: #8895b3; font-size: 14px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: all 0.3s ease; }
        .tab-btn.active[data-platform="quotex"] { background: #00e676; color: #000; }
        .tab-btn.active[data-platform="binomo"] { background: #ffea00; color: #000; }
        .tab-btn.active[data-platform="olymp"] { background: #00b0ff; color: #fff; }
        #signals-container { display: flex; flex-direction: column; gap: 12px; }
        .signal-card { background: #171c26; border-radius: 12px; padding: 22px; border-left: 5px solid #283042; box-shadow: 0 4px 15px rgba(0,0,0,0.2); transition: all 0.3s ease; animation: fadeIn 0.5s ease-in-out; }
        .pair-title { font-size: 19px; font-weight: bold; margin: 0; text-align: left; }
        .up-signal { color: #00e676; font-weight: bold; }
        .down-signal { color: #ff5252; font-weight: bold; }
        .no-signals { padding: 30px; color: #8895b3; font-size: 14px; background: #171c26; border-radius: 12px; border: 1px dashed #283042; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="welcome-box">
        <h1>Arjun VIP Signals</h1>
        <p>Premium Trading Analysis & Live Market Signals</p>
    </div>

    <div class="admin-box">
        <h3>Official Governor Details</h3>
        <div class="admin-detail"><span>Governor/Owner:</span> <b>Arjun Basak</b></div>
        <div class="admin-detail"><span>WhatsApp/Call:</span> <b>+91 8767812831</b></div>
        <div class="admin-detail"><span>Official Email:</span> <b>arjuntrader79@gmail.com</b></div>
    </div>

    <div class="social-links">
        <a href="https://www.facebook.com/share/176AzeR3tj/" target="_blank" class="social-btn fb-btn">Facebook Profile</a>
        <a href="https://www.instagram.com/arjuntrader79?igsh=Y24yb3l1ZmVvNm9n" target="_blank" class="social-btn insta-btn">Instagram Page</a>
    </div>

    <div class="tab-container">
        <button class="tab-btn" data-platform="quotex" onclick="switchPlatform('quotex')">Quotex</button>
        <button class="tab-btn active" data-platform="binomo" onclick="switchPlatform('binomo')">Binomo</button>
        <button class="tab-btn" data-platform="olymp" onclick="switchPlatform('olymp')">Olymp Trade</button>
    </div>

    <div id="signals-container"></div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        
        let currentPlatform = 'binomo';
        let firebaseData = {};

        // Aapki bheji hui saari currencies permanently yahan add kar di gayi hain
        const supportedPairs = {
            // --- NORMAL / STANDARD PAIRS ---
            "AUDCAD": "AUD/CAD", "AUDCHF": "AUD/CHF", "AUDJPY": "AUD/JPY", "AUDNZD": "AUD/NZD", "AUDUSD": "AUD/USD",
            "CADDKK": "CAD/DKK", "CADJPY": "CAD/JPY", "CADMXN": "CAD/MXN", "CADNOK": "CAD/NOK", "CADSEK": "CAD/SEK", "CADSGD": "CAD/SGD",
            "CHFDKK": "CHF/DKK", "CHFJPY": "CHF/JPY", "CHFNOK": "CHF/NOK", "CHFPLN": "CHF/PLN", "CHFSEK": "CHF/SEK", "CHFSGD": "CHF/SGD",
            "EURAUD": "EUR/AUD", "EURCAD": "EUR/CAD", "EURCHF": "EUR/CHF", "EURGBP": "EUR/GBP", "EURHUF": "EUR/HUF", "EURILS": "EUR/ILS", "EURJPY": "EUR/JPY", "EURNZD": "EUR/NZD", "EURPLN": "EUR/PLN", "EURUSD": "EUR/USD",
            "GBPAUD": "GBP/AUD", "GBPCAD": "GBP/CAD", "GBPCHF": "GBP/CHF", "GBPHUF": "GBP/HUF", "GBPJPY": "GBP/JPY", "GBPNZD": "GBP/NZD", "GBPUSD": "GBP/USD",
            "NZDCAD": "NZD/CAD", "NZDCHF": "NZD/CHF", "NZDJPY": "NZD/JPY", "NZDSEK": "NZD/SEK", "NZDSGD": "NZD/SGD", "NZDUSD": "NZD/USD",
            "USDCAD": "USD/CAD", "USDCHF": "USD/CHF", "USDCZK": "USD/CZK", "USDHUF": "USD/HUF", "USDILS": "USD/ILS", "USDJPY": "USD/JPY", "USDMXN": "USD/MXN", "USDPLN": "USD/PLN", "USDSEK": "USD/SEK", "USDZAR": "USD/ZAR",
            "ZARJPY": "ZAR/JPY",

            // --- OTC PAIRS ---
            "AUDCADOTC": "AUD/CAD OTC", "AUDCHFOTC": "AUD/CHF OTC", "AUDJPYOTC": "AUD/JPY OTC", "AUDNZDOTC": "AUD/NZD OTC", "AUDUSDOTC": "AUD/USD OTC",
            "CADCHFOTC": "CAD/CHF OTC", "CADJPYOTC": "CAD/JPY OTC", "CHFJPYOTC": "CHF/JPY OTC",
            "EURAUDOTC": "EUR/AUD OTC", "EURCADOTC": "EUR/CAD OTC", "EURCHFOTC": "EUR/CHF OTC", "EURGBPOTC": "EUR/GBP OTC", "EURJPYOTC": "EUR/JPY OTC", "EURNZDOTC": "EUR/NZD OTC", "EURUSDOTC": "EUR/USD OTC",
            "GBPAUDOTC": "GBP/AUD OTC", "GBPCADOTC": "GBP/CAD OTC", "GBPCHFOTC": "GBP/CHF OTC", "GBPJPYOTC": "GBP/JPY OTC", "GBPNZDOTC": "GBP/NZD OTC", "GBPUSDOTC": "GBP/USD OTC",
            "NZDCADOTC": "NZD/CAD OTC", "NZDCHFOTC": "NZD/CHF OTC", "NZDJPYOTC": "NZD/JPY OTC", "NZDUSDOTC": "NZD/USD OTC",
            "USDARSOTC": "USD/ARS OTC", "USDBDTOTC": "USD/BDT OTC", "USDBRLOTC": "USD/BRL OTC", "USDCHFOTC": "USD/CHF OTC", "USDCOPOTC": "USD/COP OTC", "USDDZDOTC": "USD/DZD OTC", "USDEGPOTC": "USD/EGP OTC", "USDIDROTC": "USD/IDR OTC", "USDINROTC": "USD/INR OTC", "USDJPYOTC": "USD/JPY OTC", "USDMXNOTC": "USD/MXN OTC", "USDNGNOTC": "USD/NGN OTC", "USDPHPOTC": "USD/PHP OTC", "USDPKROTC": "USD/PKR OTC", "USDZAROTC": "USD/ZAR OTC",
            "GOLDOTC": "GOLD OTC", "SILVEROTC": "SILVER OTC",

            // --- CRYPTO & INDICES ---
            "BTCUSD": "Bitcoin", "BITCOIN": "Bitcoin", "BITCOINCASHOTC": "Bitcoin Cash (OTC)", "BITCOINOTC": "Bitcoin OTC",
            "DOGECOINOTC": "Dogecoin OTC", "ETHEREUMOTC": "Ethereum OTC", "LITECOINOTC": "Litecoin OTC", "RIPPLEOTC": "Ripple OTC",
            "SOLANAOTC": "Solana OTC", "TONCOINOTC": "Toncoin (OTC)", "UNISWAPOTC": "Uniswap (OTC)", "PANCAKESWAPOTC": "Pancake Swap (OTC)",
            "CARDANO": "Cardano", "CHAINLINK": "Chainlink",
            "ASIACOMPOSITEINDEX": "Asia Composite Index", "QUICKLER": "Quickler", "STABLETICKINDEX": "Stable Tick Index",

            // --- BACKUP ALIASES ---
            "SAXOCADSEK": "CAD/SEK", "CADSEK": "CAD/SEK", "CRYPTOIDX": "Crypto IDX"
        };

        function switchPlatform(platform) {
            currentPlatform = platform;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-platform="${platform}"]`).classList.add('active');
            renderSignals();
        }

        function renderSignals() {
            const container = document.getElementById('signals-container');
            container.innerHTML = '';
            let signalList = [];

            if (firebaseData && typeof firebaseData === 'object') {
                Object.keys(firebaseData).forEach(key => {
                    let item = firebaseData[key];
                    if (item) {
                        if (item.platform && item.platform.toLowerCase() === currentPlatform.toLowerCase()) {
                            signalList.push(item);
                        } else if (item[currentPlatform] && item[currentPlatform].pair) {
                            signalList.push(item[currentPlatform]);
                        } else if (key.toLowerCase() === currentPlatform.toLowerCase() && item.pair) {
                            signalList.push(item);
                        }
                    }
                });
            }
            
            if (signalList.length === 0) {
                container.innerHTML = '<div class="no-signals">⏳ Waiting for live TradingView Alerts...</div>';
                return;
            }

            let sideColor = '#ffea00';
            if (currentPlatform === 'quotex') sideColor = '#00e676';
            if (currentPlatform === 'olymp') sideColor = '#00b0ff';

            signalList.forEach(sig => {
                if(sig && sig.pair && sig.type) {
                    const isUp = sig.type.toLowerCase().includes('up') || sig.type.toLowerCase().includes('call');
                    const dirClass = isUp ? 'up-signal' : 'down-signal';

                    let cleanPair = sig.pair;
                    let upperKey = sig.pair.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
                    if (supportedPairs[upperKey]) {
                        cleanPair = supportedPairs[upperKey];
                    }

                    const cardHtml = `
                        <div class="signal-card" style="border-left-color: ${sideColor}">
                            <p class="pair-title">${cleanPair}</p>
                            <div style="display:flex; justify-content:space-between; margin-top:15px; font-size: 14px;">
                                <span>Type: <span class="${dirClass}">${sig.type}</span></span>
                                <span style="color: #b0b9cd;">Expiry: <b>${sig.expiry}</b></span>
                            </div>
                        </div>
                    `;
                    container.innerHTML += cardHtml;
                }
            });
        }

        function fetchSignals() {
            fetch("https://arjun-signals-default-rtdb.firebaseio.com/signals.json")
                .then(r => r.json())
                .then(d => { 
                    if(d) { firebaseData = d; }
                    renderSignals(); 
                })
                .catch(err => {
                    console.error("Firebase Error:", err);
                    renderSignals();
                });
        }

        setInterval(fetchSignals, 2000);
        fetchSignals();
    </script>
</body>
</html>
