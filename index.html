<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trading Signal Board</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0e1118;
            color: #ffffff;
            margin: 0;
            padding: 15px;
            text-align: center;
        }
        h2 { margin-bottom: 20px; font-size: 22px; color: #f1f1f1; }
        
        .tab-container {
            display: flex;
            justify-content: space-around;
            background: #171c26;
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 25px;
            border: 1px solid #283042;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: #8895b3;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s;
        }
        .tab-btn.active[data-platform="quotex"] { background: #00e676; color: #000; }
        .tab-btn.active[data-platform="binomo"] { background: #ffea00; color: #000; }
        .tab-btn.active[data-platform="olymp"] { background: #00b0ff; color: #fff; }

        .signal-list { display: flex; flex-direction: column; gap: 15px; }
        .signal-card {
            background: #171c26;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border-left: 5px solid #283042;
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .signal-card.quotex { border-left-color: #00e676; }
        .signal-card.binomo { border-left-color: #ffea00; }
        .signal-card.olymp { border-left-color: #00b0ff; }

        .pair-name { font-size: 18px; font-weight: bold; text-align: left; margin: 0; }
        .details { display: flex; justify-content: space-between; margin-top: 15px; font-size: 14px; color: #b0b9cd; }
        
        .direction { font-weight: bold; font-size: 16px; }
        .up-signal { color: #00e676; }
        .down-signal { color: #ff5252; }
        .no-signal { color: #8895b3; font-style: italic; padding: 20px; }
    </style>
</head>
<body>

    <h2>📊 LIVE SIGNAL BOARD</h2>

    <div class="tab-container">
        <button class="tab-btn active" data-platform="quotex" onclick="switchPlatform('quotex')">Quotex</button>
        <button class="tab-btn" data-platform="binomo" onclick="switchPlatform('binomo')">Binomo</button>
        <button class="tab-btn" data-platform="olymp" onclick="switchPlatform('olymp')">Olymp Trade</button>
    </div>

    <div class="signal-list" id="signals-container">
        <p class="no-signal">Live signals ka wait ho raha hai...</p>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        let currentPlatform = 'quotex';
        let allSignals = {};

        const firebaseURL = "https://arjun-signals-default-rtdb.firebaseio.com/signals.json";

        function switchPlatform(platform) {
            currentPlatform = platform;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelector(`[data-platform="${platform}"]`).classList.add('active');
            renderSignals();
        }

        function renderSignals() {
            const container = document.getElementById('signals-container');
            container.innerHTML = '';

            if (allSignals && allSignals[currentPlatform]) {
                const platformData = allSignals[currentPlatform];
                const pairs = Object.keys(platformData);
                
                pairs.forEach(key => {
                    const sig = platformData[key];
                    const isUp = sig.type.toLowerCase().includes('up') || sig.type.toLowerCase().includes('call');
                    const dirClass = isUp ? 'up-signal' : 'down-signal';

                    const card = document.createElement('div');
                    card.className = `signal-card ${currentPlatform}`;
                    card.style.display = 'block';
                    card.innerHTML = `
                        <p class="pair-name">${sig.pair}</p>
                        <div class="details">
                            <span>Type: <span class="direction ${dirClass}">${sig.type}</span></span>
                            <span>Expiry: ${sig.expiry}</span>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } else {
                container.innerHTML = `<p class="no-signal">Abhi ${currentPlatform.toUpperCase()} ke liye koi live signal nahi hai.</p>`;
            }
        }

        function fetchSignals() {
            fetch(firebaseURL)
                .then(response => response.json())
                .then(data => {
                    allSignals = data;
                    renderSignals();
                })
                .catch(err => console.error("Error:", err));
        }

        setInterval(fetchSignals, 3000);
        fetchSignals();
    </script>
</body>
</html>
